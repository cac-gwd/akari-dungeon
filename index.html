<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111c22"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="灯の迷宮"><meta name="description" content="一歩、一手、灯の先へ。タッチで遊ぶターン制ローグライク。"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><title>灯の迷宮</title></head>
<body><main class="game"><header><div class="brand"><span class="seal">灯</span><div><h1>灯の迷宮 <span id="header-version">v1.1.4</span></h1><span class="eyebrow">AKARI / THE QUIET DEPTHS</span></div></div><button id="help" class="round" aria-label="遊び方と設定">?</button></header>
<section class="stats" aria-label="探索者の状態"><div class="floor"><small>迷宮</small><strong id="floor">B1<span>F</span></strong></div><div class="vitals"><div class="statline"><span>生命 <b id="hp"></b></span><span id="level"></span></div><div class="meter"><i id="hpbar"></i></div><div class="statline subtle"><span id="hunger"></span><span id="power"></span></div></div></section>
<section class="board"><div class="map-caption"><span id="area">苔むす回廊</span><span id="turn">第 0 手</span></div><canvas id="map" aria-label="迷宮。方向ボタンで移動し、隣の敵の方向へ進むと攻撃します。"></canvas><div id="ground-status" class="ground-status" role="status" hidden></div><div class="map-footer"><span><i class="dot"></i> あなた</span><span>◇ 道具</span><span>▤ 階段</span><button id="overview" aria-label="全体図の表示切替">全体図 ↗</button></div></section>
<section id="log" class="log" aria-live="polite" aria-atomic="true"></section>
<section class="controls"><div class="dpad" aria-label="移動"><button data-move="-1,-1" aria-label="左上">↖</button><button data-move="0,-1" aria-label="上">↑</button><button data-move="1,-1" aria-label="右上">↗</button><button data-move="-1,0" aria-label="左">←</button><button data-action="wait" class="wait" aria-label="一手待つ">待つ</button><button data-move="1,0" aria-label="右">→</button><button data-move="-1,1" aria-label="左下">↙</button><button data-move="0,1" aria-label="下">↓</button><button data-move="1,1" aria-label="右下">↘</button></div><div class="actions"><button id="bag"><span>◇</span>道具袋 <small id="bagcount"></small></button><button id="stairs"><span>▤</span><b id="stairlabel">階段を降りる</b></button><div class="hint">敵の方向へ移動で攻撃<br>操作するまで時は止まる</div></div></section><footer><span id="version" aria-label="ゲームのバージョン"></span><span id="save-status">端末に自動保存</span><span id="offline">オフライン準備中</span></footer></main>
<dialog id="modal"><div class="modal-head"><span class="eyebrow">AKARI</span><button id="close" aria-label="閉じる">×</button></div><div id="modalbody"></div></dialog><script type="module" src="./app.js"></script></body></html>
